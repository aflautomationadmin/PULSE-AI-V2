# PULSE-AI-V2 — Full Stack Docker Compose
#
# Services:
#   pulse-backend   FastAPI Python API          → http://localhost:8000
#   pulse-frontend  React/Vite (nginx)           → http://localhost:3000
#   mongodb         Conversation thread storage  → localhost:27017
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f pulse-backend

services:

  # ── MongoDB — conversation thread storage ─────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend — FastAPI ──────────────────────────────────────────────────────
  pulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulse-backend:latest
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost refs to use Docker service names
      MONGO_URI: mongodb://mongodb:27017
    volumes:
      # Persist caches across container restarts
      - backend_cache:/app/.cache
      # Hot-reload business context without rebuilding
      - ./business_context.json:/app/business_context.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend — React/Vite served by nginx ─────────────────────────────────
  pulse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pulse-frontend:latest
    restart: unless-stopped
    depends_on:
      pulse-backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongo_data:
  backend_cache:
